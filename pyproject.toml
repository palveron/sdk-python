[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vexis-sdk"
version = "0.4.0"
description = "Official Python SDK for the VEXIS AI Governance Platform"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [{ name = "VEXIS", email = "sdk@vexis.io" }]
keywords = ["ai-governance", "guardrails", "llm-security", "eu-ai-act", "compliance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.25.0,<1.0.0",
]

[project.optional-dependencies]
async = ["httpx[http2]>=0.25.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "mypy>=1.10", "ruff>=0.5"]

[project.urls]
Homepage = "https://vexis.io"
Documentation = "https://docs.vexis.io/sdk/python"
Repository = "https://github.com/vexis-security/vexis-sdk-python"
Changelog = "https://github.com/vexis-security/vexis-sdk-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["vexis"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.mypy]
strict = true
python_version = "3.9"
