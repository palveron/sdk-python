[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "palveron-sdk"
version = "1.0.0"
description = "Official Palveron Python SDK — AI Governance Gateway client for policy enforcement, trace verification, and compliance automation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Palveron", email = "hello@palveron.com" }]
keywords = [
    "palveron",
    "ai-governance",
    "guardrails",
    "eu-ai-act",
    "compliance",
    "llm",
    "agent-governance",
    "policy-enforcement",
    "blockchain-attestation",
    "dora",
    "gdpr",
    "nist",
    "audit-trail",
    "pii-detection",
    "mcp",
    "agentic-ai",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.24",
]

[project.optional-dependencies]
async = ["httpx[http2]>=0.25.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "mypy>=1.10", "ruff>=0.5", "build"]

[project.urls]
Homepage = "https://palveron.com"
Documentation = "https://docs.palveron.com/sdks"
Repository = "https://github.com/palveron/sdk-python"
Issues = "https://github.com/palveron/sdk-python/issues"
Changelog = "https://github.com/palveron/sdk-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["palveron"]

[tool.ruff]
target-version = "py38"
line-length = 120

[tool.mypy]
strict = true
python_version = "3.8"
